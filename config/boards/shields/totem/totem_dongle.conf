CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_ZMK_SLEEP=n

# ZMK Studio — live click-to-edit keymap over the dongle's USB.
# Locking off so it's always editable when plugged in (simplest for now).
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# --- Dongle OLED screen (128x64) ---
# The screen hardware itself (SSD1306 on the nice!nano's pro-micro I2C pins) is
# defined in totem_dongle.overlay. The layout comes from the totem_display
# shield in config/boards/shields, which is englmaxi/zmk-dongle-display forked
# into this repo so it can carry a widget of our own. Its Kconfig symbols are
# namespaced ZMK_TOTEM_DISPLAY_* so they can't collide with the upstream
# module, which is still on the shield search path but no longer selected.
#
# Show the Mac Command symbol instead of the Windows flag for the GUI modifier.
CONFIG_ZMK_TOTEM_DISPLAY_MAC_MODIFIERS=y

# The key log replaces the bongo cat: it needs the full width of the screen,
# and knowing what the board actually sent is worth more than the animation.
CONFIG_ZMK_TOTEM_DISPLAY_KEYLOG=y
CONFIG_ZMK_TOTEM_DISPLAY_BONGO_CAT=n

# --- Key-press recorder (config/recorder) ---
# Streams timed key events to the Mac over a second USB serial port, for tuning
# hold-tap / combo timings and placement. Off at every boot; the Z+X combo
# switches it on and off, and the screen shows REC while it is on. Nothing is
# sent unless the Mac collector has the port open.
CONFIG_ZMK_RECORDER=y
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=2048

