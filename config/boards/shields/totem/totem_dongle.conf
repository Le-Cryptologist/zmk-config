CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_ZMK_SLEEP=n

# ZMK Studio — live click-to-edit keymap over the dongle's USB.
# Locking off so it's always editable when plugged in (simplest for now).
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# --- Dongle OLED screen (128x64) via englmaxi/zmk-dongle-display ---
# The screen hardware itself (SSD1306 on the nice!nano's pro-micro I2C pins) is
# defined in totem_dongle.overlay. The module supplies CONFIG_ZMK_DISPLAY and the
# central battery fetching; here we just tweak the look.
# Show the Mac Command symbol instead of the Windows flag for the GUI modifier.
CONFIG_ZMK_DONGLE_DISPLAY_MAC_MODIFIERS=y

